name: Build & Release macOS App (No-Signing)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Sparkle Binaries
        run: |
          curl -L https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          mkdir sparkle_bin
          tar -xf sparkle.tar.xz -C sparkle_bin
          
      - name: Build Archive
        run: |
          xcodebuild -scheme "PasteMe" \
            -configuration Release \
            -archivePath ./build/PasteMe.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .app
        run: |
          xcodebuild -exportArchive \
            -archivePath ./build/PasteMe.xcarchive \
            -exportPath ./dist \
            -exportOptionsPlist ExportOptions.plist

      - name: Ad-hoc Sign
        run: |
          codesign --force --deep -s - ./dist/PasteMe.app

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "PasteMe Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "dist/PasteMe.dmg" \
            "dist/PasteMe.app"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/PasteMe.dmg

      - name: Setup Appcast Directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git clone --branch gh-pages https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git gh-pages || (mkdir gh-pages && cd gh-pages && git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git)
          cp dist/PasteMe.dmg gh-pages/

      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | ./sparkle_bin/bin/generate_appcast --ed-key-file - --download-url-prefix https://github.com/khanhworktime/Paste-Me/releases/download/${{ github.ref_name }}/ gh-pages/
          
      - name: Publish Appcast
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gh-pages
          rm PasteMe.dmg
          git add appcast.xml
          git commit -m "chore: update appcast for ${{ github.ref_name }}" || echo "No changes to appcast"
          git push -u origin gh-pages
